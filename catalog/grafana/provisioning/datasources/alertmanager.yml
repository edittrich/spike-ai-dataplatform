apiVersion: 1

datasources:
  # Phase 4 (hardening plan, Part 5 item 3): lets Grafana's own Alerting UI
  # show alert state from the real Alertmanager instance (catalog/alertmanager.yml)
  # instead of only Grafana's own separate managed-alerts engine.
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    # H4: alertmanager is a bridge peer on platform_network now, reached
    # by its service name, not 127.0.0.1.
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
    editable: false
