apiVersion: 1

datasources:
  - name: Prometheus
    # Explicit, stable uid (Grafana would otherwise auto-generate one) so
    # tempo.yml's datasource can reference this one by a known ID for its
    # trace-to-metrics/service-map linking, rather than an ID that could
    # change across a fresh provisioning run.
    uid: prometheus
    type: prometheus
    access: proxy
    # H4: prometheus is a bridge peer on platform_network now, reached by
    # its service name, not 127.0.0.1 (which would mean Grafana's own
    # container).
    url: http://prometheus:9090
    isDefault: true
    editable: false
