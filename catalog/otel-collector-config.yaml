# ==============================================================================
# OpenTelemetry Collector Configuration
# ==============================================================================
# Receives real trace spans (OTLP/gRPC + OTLP/HTTP) from mcp_sidecar --
# scripts/_otel_tracing.py -- batches them, and forwards to the tempo service
# for storage and TraceQL querying via Grafana. Part 5 item 2 in the
# hardening plan.
#
# Uses the core `otel/opentelemetry-collector` distribution (not -contrib):
# the otlp receiver, otlp exporter, batch processor, and health_check
# extension used below are all part of the core distribution -- no need for
# the larger contrib image's hundreds of additional (unused) components.
#
# Port note: this collector's OTLP receiver stays on the conventional
# 4317/4318 ports (the well-known ports application code targets by
# default). tempo's own OTLP receiver is deliberately kept on 4319/4320
# (see catalog/tempo.yaml) -- H4: originally chosen purely to avoid a
# host-network port collision (every service in docker-compose.yml used to
# run with `network_mode: "host"`, sharing one namespace, so two services
# couldn't both bind 0.0.0.0:4317). Now that every service is on its own
# bridge-networked container (its own network namespace), that specific
# collision can no longer happen -- the numbers are kept as-is anyway to
# avoid unrelated renumbering churn, not because they're still required.
# ==============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # otlp_grpc, not the deprecated `otlp` alias (still accepted, but this
  # collector version already warns on it) -- exports to tempo's OTLP/gRPC
  # receiver. H4: tempo is a bridge peer on platform_network now, reached
  # by its service name, not 127.0.0.1 (which would mean this collector's
  # own container).
  otlp_grpc:
    endpoint: tempo:4319
    tls:
      insecure: true

extensions:
  # Not wired into docker-compose.yml as a container-native `healthcheck:` --
  # the image ships no shell/wget/curl to run one from inside the container
  # (see docker-compose.yml's comment above the tempo/otel_collector
  # services). H4: not published to the host either (docker-compose.yml's
  # `ports:` for this service only covers the OTLP receivers) -- this
  # endpoint is currently unreachable outside the container. Manual
  # inspection now needs `docker exec otel_collector` (no shell/curl
  # available, per the note above -- a `docker compose exec` debugging
  # session would need to install one) or publishing this port explicitly
  # if this becomes a routine need.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc]
