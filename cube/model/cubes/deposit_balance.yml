cubes:
  - name: deposit_balance
    sql_table: financial.deposit_balance
    title: "Deposit Balance Data Product"
    description: "Semantic Cube for Real-time book, available, and ledger balances."

    joins:
      - name: deposit_account
        sql: "{CUBE}.deposit_account_id = {deposit_account.deposit_account_id}"
        relationship: belongs_to

    pre_aggregations:
      # Phase 4 (Part 5 item 6 / H3): the balance-sum rollup deposit_account.yml's
      # account_activity_rollup deliberately excludes (see its comment for the
      # `missing FROM-clause entry` bug this sidesteps by living on the cube that
      # owns available_balance/ledger_balance/accrued_interest directly).
      # account_type/account_status pulled in via the existing belongs_to
      # deposit_account join -- confirmed live this direction (fact table ->
      # dimension table) doesn't hit the same rollup SQL generation bug the
      # reverse direction did.
      - name: balance_totals_rollup
        measures:
          - total_available_balance
          - total_ledger_balance
          - total_accrued_interest
        dimensions:
          - currency_code
          - deposit_account.account_type
          - deposit_account.account_status
        refresh_key:
          every: "1 hour"

    measures:
      - name: total_current_balance
        sql: current_balance
        type: sum
        format: currency

      - name: total_available_balance
        sql: available_balance
        type: sum
        format: currency

      - name: total_ledger_balance
        sql: ledger_balance
        type: sum
        format: currency

      - name: total_accrued_interest
        sql: accrued_interest
        type: sum
        format: currency

    dimensions:
      - name: deposit_balance_id
        sql: deposit_balance_id
        type: string
        primary_key: true

      - name: deposit_account_id
        sql: deposit_account_id
        type: string

      - name: currency_code
        sql: currency_code
        type: string

      - name: available_balance
        sql: available_balance
        type: number

      - name: current_balance
        sql: current_balance
        type: number

      - name: ledger_balance
        sql: ledger_balance
        type: number

      - name: accrued_interest
        sql: accrued_interest
        type: number

      - name: as_of_timestamp
        sql: as_of_timestamp
        type: time

      - name: md_is_active
        sql: md_is_active
        type: boolean
