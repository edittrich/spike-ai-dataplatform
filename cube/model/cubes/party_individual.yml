cubes:
  - name: party_individual
    sql_table: financial.party_individual
    title: "Party Individual Subtype Data Product"
    description: "Individual natural person attributes (Name, DOB, Gender, Citizenship)."

    joins:
      - name: party
        sql: "{CUBE}.party_id = {party.party_id}"
        relationship: belongs_to

      # D9: unlocks AML high-risk-citizenship-country slicing (see ref_country.yml).
      - name: ref_country
        sql: "{CUBE}.citizenship_country_code = {ref_country.country_code}"
        relationship: belongs_to

    measures:
      - name: total_individuals
        type: count

    dimensions:
      - name: party_individual_id
        sql: party_individual_id
        type: string
        primary_key: true

      - name: party_id
        sql: party_id
        type: string

      - name: first_name
        sql: first_name
        type: string

      - name: last_name
        sql: last_name
        type: string

      - name: date_of_birth
        sql: date_of_birth
        type: time
        # H2: PersonalData.SpecialCategory (see party_organization.yml's
        # registration_number dimension for the full rationale/verification
        # note -- identical fix, same shared classification source, and the
        # same caveat: `public: false` alone does not block a REST query;
        # cube/cube.js's queryRewrite is the real enforcement).
        public: false

      - name: gender
        sql: gender
        type: string
        # H2: PersonalData.SpecialCategory -- see date_of_birth above.
        public: false

      - name: citizenship_country_code
        sql: citizenship_country_code
        type: string

      - name: tax_residence_country_code
        sql: tax_residence_country_code
        type: string

      - name: md_is_active
        sql: md_is_active
        type: boolean
