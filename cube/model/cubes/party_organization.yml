cubes:
  - name: party_organization
    sql_table: financial.party_organization
    title: "Party Organization Subtype Data Product"
    description: "Corporate entity organization details (Legal Name, Reg Number, NACE Code)."

    joins:
      - name: party
        sql: "{CUBE}.party_id = {party.party_id}"
        relationship: belongs_to

      # D9: unlocks AML high-risk-incorporation-country slicing (see ref_country.yml).
      - name: ref_country
        sql: "{CUBE}.incorporation_country_code = {ref_country.country_code}"
        relationship: belongs_to

      # D9: unlocks NACE industry-risk-level slicing (see ref_nace_industry.yml).
      - name: ref_nace_industry
        sql: "{CUBE}.nace_code = {ref_nace_industry.nace_code}"
        relationship: belongs_to

    measures:
      - name: total_organizations
        type: count

    dimensions:
      - name: party_organization_id
        sql: party_organization_id
        type: string
        primary_key: true

      - name: party_id
        sql: party_id
        type: string

      - name: legal_name
        sql: legal_name
        type: string

      - name: trade_name
        sql: trade_name
        type: string

      - name: registration_number
        sql: registration_number
        type: string
        # H2: contracts/party_customer_data_product_contract.yaml classifies
        # this PersonalData.SpecialCategory (via scripts/_pii_classification.py,
        # the shared source of truth) -- was exposed as a plain queryable
        # dimension with no security context. `public: false` is set here,
        # but verified live it does NOT by itself block a REST /load query
        # against this field -- Cube.js v0.35 only checks `public` for
        # GraphQL schema generation, never the REST query path (confirmed by
        # reading api-gateway's own source: `cube.public === false` appears
        # solely in graphql.js). The actual enforcement is
        # `queryRewrite` in cube/cube.js, which rejects any query
        # referencing this field regardless of this flag; kept here anyway
        # as the correct declarative signal for GraphQL/Playground/BI-tool
        # discovery, consistent with how the field is genuinely meant to be
        # used. See tests/test_pii_cube_enforcement.py (checks this flag is
        # set) and cube/cube.js's MASKED_PII_MEMBERS (the real access
        # control, which must be kept in sync with every `public: false`
        # dimension by hand -- no automated cross-check exists between the
        # two, a known gap documented in cube.js's own comment).
        public: false

      - name: incorporation_date
        sql: incorporation_date
        type: time

      - name: incorporation_country_code
        sql: incorporation_country_code
        type: string

      - name: nace_code
        sql: nace_code
        type: string

      - name: legal_form
        sql: legal_form
        type: string

      - name: md_is_active
        sql: md_is_active
        type: boolean
