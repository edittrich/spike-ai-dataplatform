# Bounded, rotated container logs on every service -- previously unset
# anywhere, so a misbehaving/chatty container (e.g. one stuck retry-looping
# under `restart: always`) could grow its log file without limit (Q14).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# NOT DONE HERE, deliberately (H4 in the hardening plan): migrating neo4j,
# cube, prometheus, grafana, mcp_sidecar, tempo, and otel_collector off
# `network_mode: "host"` onto a user-defined bridge network with explicit
# 127.0.0.1:<port>:<port> publishing, the way
# openmetadata_server/openmetadata_db/openmetadata_search already work.
# (tempo/otel_collector, added after this note was first written, followed
# the same host-networking convention as the other five for consistency --
# introducing a new, different networking model for just two services would
# have made the eventual bridge migration harder to reason about, not
# easier.) This pass instead did the parts of H4 that were genuinely
# config-only and low-risk: openmetadata_server's 0.0.0.0 publish
# inconsistency (fixed, see OPENMETADATA_HOST below), plus :ro config mounts,
# persistent volumes, depends_on, logging limits, and security_opt across
# every service (Q14). The full bridge-network migration was assessed and
# intentionally deferred -- it's a real networking restructure, not a
# config toggle, for two concrete reasons:
#   1. PostgreSQL/Supabase is not a compose service (see D1) -- it's reached
#      today at 127.0.0.1:54322 because every host-mode container shares the
#      host's network namespace. Both `cube` and `mcp_sidecar` need it.
#      Bridge-networked containers would need `host.docker.internal` /
#      `extra_hosts: ["host.docker.internal:host-gateway"]` instead, and
#      every default in this file, .env.example, and the scripts that read
#      POSTGRES_HOST would need to change consistently, not just one.
#   2. Inter-service calls between these services (mcp_sidecar -> neo4j/cube/
#      otel_collector, grafana -> prometheus/tempo, otel_collector -> tempo)
#      currently all resolve via 127.0.0.1 too. Bridge networking gives real
#      service-name DNS instead (`neo4j:7687`, `cube:4000`, `prometheus:9090`,
#      `tempo:4319`) -- correct, but it means updating
#      catalog/prometheus.yml's scrape targets, every
#      catalog/grafana/provisioning/datasources/*.yml URL, and this file's
#      own NEO4J_URI/CUBEJS_URL/OTEL_EXPORTER_OTLP_ENDPOINT defaults together,
#      then re-verifying each cross-service call live. Get any one of these
#      wrong and a service looks "up" while silently unable to reach its
#      dependency -- worse for tempo/otel_collector specifically, since
#      neither image has a healthcheck to even reveal onto (see the comment
#      above those two services), so a wrong DNS name there would fail
#      silently rather than show up as an unhealthy container.
# Both are mechanically doable, but not something to rush through inside an
# already-large hardening pass on a stack that's been carefully verified
# working end-to-end -- this belongs in its own dedicated pass with room to
# debug connectivity issues without extended platform downtime.

services:
  # ===========================================================================
  # 1. Enterprise Catalog & Metadata Governance (OpenMetadata 1.3.1)
  # ===========================================================================
  openmetadata_db:
    image: mysql:8.0.35
    container_name: openmetadata_mysql
    restart: always
    deploy:
      resources:
        limits:
          memory: 768m
    environment:
      - MYSQL_ROOT_PASSWORD=${OPENMETADATA_MYSQL_PASSWORD}
      - MYSQL_DATABASE=openmetadata_db
      - MYSQL_USER=openmetadata_user
      - MYSQL_PASSWORD=${OPENMETADATA_MYSQL_PASSWORD}
    ports:
      # Loopback-only: this port exists for local debugging (e.g. a host mysql
      # client). openmetadata_server itself reaches this container over the
      # default bridge network via the `openmetadata_db` DNS name, not this
      # published port.
      - "127.0.0.1:33060:3306"
    volumes:
      - ./catalog/mysql-data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openmetadata_search:
    image: opensearchproject/opensearch:2.11.0
    container_name: openmetadata_search
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      - cluster.name=openmetadata-cluster
      - node.name=openmetadata-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      # Loopback-only (see rationale above): openmetadata_server reaches this
      # container over the default bridge network via `openmetadata_search`,
      # not this published port. DISABLE_SECURITY_PLUGIN=true means anyone who
      # can reach this port has unauthenticated read/write access to the
      # catalog's search index, so it must not be published beyond localhost.
      - "127.0.0.1:9200:9200"
    # bootstrap.memory_lock=true above previously had no matching ulimit, so
    # OpenSearch's own mlockall() call failed silently (logged, not fatal) and
    # the JVM heap could still be swapped out under host memory pressure --
    # this is the standard companion setting OpenSearch's own docs recommend.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openmetadata_server:
    image: openmetadata/server:1.3.1
    container_name: openmetadata_server
    restart: always
    deploy:
      resources:
        limits:
          memory: 1536m
    ports:
      # Previously unqualified ("8585:8585"), which Docker binds to 0.0.0.0 --
      # every other backend port in this file is deliberately loopback-only
      # (see MySQL/OpenSearch above), so this was the one unexplained
      # inconsistency H4 in the hardening plan flagged. Unlike those two raw
      # data ports, though, this *is* the platform's human-facing catalog UI
      # -- there's a legitimate reason someone might want to reach it from
      # another machine on their LAN -- so the fix here is the same pattern
      # already used for MCP_HOST: configurable, secure-by-default (loopback
      # unless deliberately opted out via OPENMETADATA_HOST in .env), rather
      # than silently either-or.
      - "${OPENMETADATA_HOST:-127.0.0.1}:8585:8585"
    environment:
      - DB_HOST=openmetadata_db
      - DB_PORT=3306
      - DB_DRIVER_CLASS=com.mysql.cj.jdbc.Driver
      - DB_SCHEME=mysql
      - DB_USER=openmetadata_user
      # OpenMetadata's own config template (openmetadata.yaml) reads
      # DB_USER_PASSWORD, not DB_PASSWORD -- the latter is silently ignored,
      # which meant this service always fell back to the image's own
      # hardcoded default password ("openmetadata_password") regardless of
      # what was set here. DB_USER_NAME below is similarly unused by the
      # template; kept only for backward compatibility with anything that
      # might read it.
      - DB_USER_PASSWORD=${OPENMETADATA_MYSQL_PASSWORD}
      - DB_USER_NAME=openmetadata_db
      - SEARCH_TYPE=opensearch
      - ELASTICSEARCH_HOST=openmetadata_search
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_SCHEME=http
      - AUTHORIZER_CLASS_NAME=org.openmetadata.service.security.DefaultAuthorizer
      - AUTHENTICATION_PROVIDER=basic
    depends_on:
      openmetadata_db:
        condition: service_healthy
      openmetadata_search:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8585/api/v1/system/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ===========================================================================
  # 2. Knowledge Graph Database (Neo4j 5 Community Edition)
  # ===========================================================================
  neo4j:
    image: neo4j:5.18.0-community
    container_name: neo4j_knowledge_graph
    restart: always
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 1536m
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/${NEO4J_PASSWORD}}
      # No script or MCP tool in this repo calls any APOC procedure (verified:
      # zero `apoc.` references outside this file). The plugin was previously
      # installed with EVERY procedure unrestricted, including apoc.load.json/
      # apoc.load.jdbc-style procedures that can reach arbitrary URLs/files --
      # an SSRF/exfiltration surface for no functional benefit. If a future
      # script genuinely needs a specific APOC procedure, re-add the plugin with
      # `NEO4J_dbms_security_procedures_allowlist=apoc.<specific.procedure>`
      # naming only that procedure, not the `apoc.*` wildcard.
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1024m
      # Previously unset, which lets Neo4j auto-size the page cache against
      # *host* RAM rather than this container's 1536m limit -- a likely
      # OOM-kill source on a host with more memory than the container is
      # actually allowed to use. 256m leaves headroom under the 1536m limit
      # alongside the 1024m max heap and the JVM's own overhead.
      - NEO4J_dbms_memory_pagecache_size=256m
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # 3. Open-Source Semantic Layer (Cube.js Engine)
  # ===========================================================================
  cube:
    image: cubejs/cube:v0.35
    container_name: cube_semantic_layer
    restart: always
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 768m
    environment:
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=${POSTGRES_HOST:-127.0.0.1}
      - CUBEJS_DB_PORT=54322
      - CUBEJS_DB_NAME=${POSTGRES_DB:-postgres}
      - CUBEJS_DB_USER=${POSTGRES_USER:-postgres}
      - CUBEJS_DB_PASS=${POSTGRES_PASSWORD}
      - CUBEJS_DB_SCHEMA=financial
      - CUBEJS_PORT=4000
      # No CUBEJS_SQL_PORT: the Postgres-wire SQL API it would open has no
      # equivalent to cube.js's checkAuth (there's no CUBEJS_SQL_USER/
      # CUBEJS_SQL_PASSWORD configured), and nothing in this repo uses it --
      # leaving it enabled meant an unauthenticated query interface to the
      # semantic layer on a network_mode: host port.
      # CUBEJS_DEV_MODE stays `true` -- tried flipping this to `false` as part
      # of the same hardening pass that removed CUBEJS_SQL_PORT above, but
      # production mode requires a separate Cube Store service for its
      # cache/queue driver (CUBEJS_CUBESTORE_HOST/PORT), which isn't deployed
      # in this compose file; every query fails without it. Disabling dev mode
      # is still the right target -- it serves the Developer Playground and
      # loosens some defaults on a network_mode: host port -- but it needs a
      # Cube Store service added first, not a one-line flip. checkAuth in
      # cube/cube.js itself is enforced in both modes (verified), so the
      # authentication story this platform relies on is unaffected either way.
      - CUBEJS_DEV_MODE=true
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
      - CUBEJS_TELEMETRY=false
    volumes:
      # :ro -- cube.js in particular *is* the auth implementation
      # (checkAuth); nothing running inside this container has a legitimate
      # reason to modify either mount (Q14).
      - ./cube/model:/cube/conf/model:ro
      - ./cube/cube.js:/cube/conf/cube.js:ro
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/readyz', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ===========================================================================
  # 4. Live Prometheus & Grafana Observability Suite
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus_metrics
    restart: always
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - ./catalog/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Previously no volume at all for /prometheus -- every metric sample,
      # not just dashboards/alerts, was destroyed on container recreate
      # (Q14). Named volume rather than a bind mount: the image runs as a
      # fixed non-root UID (nobody, 65534) that doesn't necessarily match
      # any host user, so a bind mount risks a permission mismatch a named
      # volume (Docker-managed ownership) avoids.
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana_observability_dashboard
    restart: always
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./catalog/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./catalog/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./catalog/grafana/dashboards:/etc/grafana/dashboards:ro
      # Previously no volume at all for /var/lib/grafana -- every dashboard
      # edit, annotation, and API key was destroyed on container recreate,
      # not just the provisioned-from-disk dashboards (Q14). Named volume
      # for the same host-UID-mismatch reason as Prometheus's, above.
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      # tempo has no healthcheck to wait on (see the comment above the
      # tempo/otel_collector services) -- service_started just waits for the
      # container to launch. Grafana tolerates a datasource that isn't ready
      # yet at its own startup regardless (marks it unhealthy in the UI,
      # doesn't crash), so this is a minor startup-ordering nicety, not a
      # correctness requirement the way the prometheus dependency is.
      tempo:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # No standalone telemetry_exporter service -- it used to run
  # scripts/telemetry_metrics_exporter_server.py (removed) as a *separate*
  # container that could never see traces recorded by mcp_sidecar, since
  # Prometheus client metrics live in-process; it was seeded with
  # `random.uniform()` fake data because there was no way to feed it anything
  # real. mcp_sidecar below now serves genuine metrics on :8000 itself, from
  # the same process that executes tool calls.

  # ===========================================================================
  # 4b. Real Distributed Tracing (OTel Collector + Tempo) -- Part 5 item 2 in
  # the hardening plan. scripts/_otel_tracing.py exports real spans (per MCP
  # tool call, per hybrid-RAG tier) via OTLP to otel_collector, which
  # forwards to tempo for storage; tempo is then queryable as a Grafana
  # datasource (trace waterfalls, TraceQL) alongside the existing Prometheus
  # metrics datasource. Both fail open by design -- a tool call must never
  # break because tracing infrastructure is down (see
  # scripts/_otel_tracing.py's own docstring); neither service is a hard
  # `depends_on` for mcp_sidecar for exactly that reason, unlike neo4j/cube
  # above, which mcp_sidecar's actual data queries need to be useful at all.
  # ===========================================================================
  # Neither service below has a `healthcheck:` -- both images are deliberately
  # minimal/distroless (verified: neither ships a shell, wget, curl, or nc;
  # `docker run --entrypoint sh ... ` fails with "executable file not found"
  # on both), a legitimate size/attack-surface tradeoff that comes at the
  # cost of not being able to express a Docker-native healthcheck without
  # adding tooling neither upstream image intends to carry. `restart: always`
  # is the resilience mechanism instead; `depends_on` below uses
  # `service_started` (container process launched) rather than
  # `service_healthy` (no such signal exists to wait on).
  tempo:
    image: grafana/tempo:3.0.2
    container_name: tempo_tracing_backend
    restart: always
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 512m
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./catalog/tempo.yaml:/etc/tempo.yaml:ro
      # Named volume, not a bind mount -- same host-UID-mismatch reasoning as
      # prometheus_data/grafana_data above (the image runs as a fixed
      # non-root UID).
      - tempo_data:/var/tempo
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  otel_collector:
    image: otel/opentelemetry-collector:0.158.0
    container_name: otel_collector
    restart: always
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 256m
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./catalog/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ===========================================================================
  # 5. FastMCP Agentic Protocol Sidecar Container Service
  # ===========================================================================
  mcp_sidecar:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile.mcp
    container_name: mcp_agentic_sidecar
    restart: always
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 512m
    # Previously no depends_on at all, so startup order against the two
    # compose-internal services this container actually queries (Neo4j,
    # Cube.js) was undefined -- it still self-heals either way (query_pg/
    # query_neo4j fail per-call and log, they don't crash the process), but
    # there's no reason to let it start racing them when compose can express
    # the real dependency. PostgreSQL/Supabase is not expressible here since
    # it isn't a compose service at all -- see D1/CLAUDE.md.
    depends_on:
      neo4j:
        condition: service_healthy
      cube:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8001
      - MCP_METRICS_PORT=8000
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_HOST=${MCP_HOST:-127.0.0.1}
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=54322
      # Connects as the least-privilege mcp_readonly role, not the postgres
      # superuser -- see the comment above POSTGRES_USER in
      # mcp_server/financial_data_mcp_server.py for why.
      - MCP_PG_READONLY_USER=${MCP_PG_READONLY_USER:-mcp_readonly}
      - MCP_PG_READONLY_PASSWORD=${MCP_PG_READONLY_PASSWORD}
      - NEO4J_URI=${NEO4J_URI:-bolt://127.0.0.1:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CUBEJS_URL=${CUBEJS_URL:-http://127.0.0.1:4000/cubejs-api/v1/load}
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
      - OPENMETADATA_URL=${OPENMETADATA_URL:-http://127.0.0.1:8585/api/v1}
      - OPENMETADATA_JWT_TOKEN=${OPENMETADATA_JWT_TOKEN}
      # This image doesn't install sentence-transformers/torch (see .env.example's
      # comment) -- hybrid_rag_search fails closed by default rather than
      # silently degrading. Leave unset/0 unless you deliberately want degraded
      # (clearly-tagged) retrieval instead.
      - ALLOW_DEGRADED_EMBEDDINGS=${ALLOW_DEGRADED_EMBEDDINGS:-0}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      # Real distributed-tracing spans -- see scripts/_otel_tracing.py.
      # otel_collector shares this container's host network namespace, so
      # it's reachable at 127.0.0.1 like every other compose-internal
      # service this file's services talk to over host networking.
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-ai-dataplatform-mcp-server}

volumes:
  # Named (not bind-mounted): both images run as a fixed non-root UID that
  # doesn't necessarily match any host user, so Docker-managed ownership
  # avoids a permission mismatch a bind mount would risk.
  prometheus_data:
  grafana_data:
  tempo_data:

