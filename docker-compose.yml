# Bounded, rotated container logs on every service -- previously unset
# anywhere, so a misbehaving/chatty container (e.g. one stuck retry-looping
# under `restart: always`) could grow its log file without limit (Q14).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# H4 (hardening plan) -- FULL BRIDGE-NETWORKING MIGRATION, done 2026-08-08 on
# explicit request. Every service in this file now sits on `platform_network`
# (a user-defined bridge network, defined at the bottom of this file) instead
# of `network_mode: "host"`; `neo4j_jmx_agent_init` also joins it for
# consistency even though it makes no network calls to a peer. This closes
# H4's original finding (six -- later thirteen, as tempo/otel_collector/the
# exporters/alertmanager were added under the same host-networking
# convention -- services reachable on every host interface with no
# Docker-native publishing control) for real, not just documents it as
# deferred.
#
# Scope was deliberately wider than the specific services first named when
# this was requested (Neo4j, Cube.js, Prometheus, Grafana, mcp_sidecar) --
# confirmed with the user before starting, because a *partial* migration
# would have silently broken real, working functionality: Prometheus's
# scrape targets and Grafana's Alertmanager/Tempo datasources are all
# services that would otherwise have stayed on host+loopback-bound, and **a
# bridge container cannot reach a service bound to 127.0.0.1 on the host at
# all** -- that address means the *bridge container's own* loopback, not the
# host's, and even `host.docker.internal`/`extra_hosts:
# ["host.docker.internal:host-gateway"]` doesn't help, since a connection
# arriving via the bridge gateway is not a loopback-originated connection as
# far as the target's own `127.0.0.1`-only bind is concerned. So every
# service that used to be `network_mode: "host"` (neo4j, cubestore, cube,
# prometheus, grafana, tempo, otel_collector, node_exporter,
# postgres_exporter, mysqld_exporter, cadvisor, alertmanager, mcp_sidecar --
# 13 total) moved together, keeping the resulting stack fully connected
# rather than leaving some services correctly migrated and others silently
# unreachable.
#
# Two real, previously-documented blockers, now actually resolved:
#   1. PostgreSQL/Supabase is not a compose service (see D1) -- reached at
#      127.0.0.1:54322 under host networking because every host-mode
#      container shared the host's network namespace. `cube`,
#      `mcp_sidecar`, and `postgres_exporter` (the three services that talk
#      to it directly) now use `host.docker.internal` via
#      `extra_hosts: ["host.docker.internal:host-gateway"]` instead --
#      required explicitly on Linux (unlike Docker Desktop on macOS/Windows,
#      where it's automatic), verified live to actually resolve and connect.
#      `.env`/`.env.example`'s own `POSTGRES_HOST` default (127.0.0.1) is
#      UNCHANGED and still correct -- it's read by host-run pipeline
#      scripts, which still reach Postgres directly over the host's real
#      loopback; only the three *containerized* services' own internal env
#      values are hardcoded to `host.docker.internal` in this file, not
#      derived from `.env`'s host-oriented default.
#   2. Inter-service calls (mcp_sidecar -> neo4j/cube/otel_collector,
#      grafana -> prometheus/tempo/alertmanager, otel_collector -> tempo,
#      prometheus -> every exporter + alertmanager) now use real Docker
#      service-name DNS (`neo4j:7687`, `cube:4000`, `prometheus:9090`,
#      `tempo:4319`, ...) -- `catalog/prometheus.yml`'s scrape targets,
#      every `catalog/grafana/provisioning/datasources/*.yml` URL,
#      `catalog/otel-collector-config.yaml`'s tempo exporter endpoint, and
#      this file's own container-internal env values were all updated and
#      re-verified live, not just edited and assumed correct.
# A third, newly-discovered requirement neither original blocker mentioned:
# every internal `--web.listen-address=127.0.0.1:<port>`-style bind (H4's
# own *original* hardening pattern, applied when these services still
# shared the host's namespace) had to change to `0.0.0.0:<port>` --
# under bridge networking, a service bound to its own container's
# `127.0.0.1` is unreachable from *any* other container on the same
# user-defined network too, not just from the host. The security property
# H4's loopback-only pattern used to provide is now expressed differently:
# by not publishing a `ports:` entry at all for a service only other
# containers need (cubestore, neo4j's JMX exporter port), or by publishing
# explicitly to `127.0.0.1:<port>:<port>` on the *host* side for services
# that also need direct host/debug access (matching
# openmetadata_server/openmetadata_db/openmetadata_search's
# already-established pattern, now the model every service follows).
#
# `.env`'s `MCP_HOST` is repurposed the same way `OPENMETADATA_HOST` already
# was: it now controls only the host-side interface `mcp_sidecar`'s ports
# are published to (still defaults to 127.0.0.1, still overridable to
# 0.0.0.0 for deliberate LAN access), not the container's own internal bind
# address, which is hardcoded to 0.0.0.0 in this file's `environment:` block
# for `mcp_sidecar` specifically (required for Docker's own port-forwarding
# and for Prometheus, a bridge peer, to scrape its metrics endpoint) --
# `mcp_server/financial_data_mcp_server.py`'s own `MCP_HOST` handling is
# unchanged and still defaults safely to 127.0.0.1 for the (still-supported)
# case of running the SSE server directly on a host, outside Docker.

# Q14 (container capability hardening -- `read_only`): every service below
# except `neo4j_jmx_agent_init` (see its own comment for the reasoned
# exception) now sets `read_only: true`, with an explicit, minimal
# `tmpfs`/writable-mount allowlist for whatever each image genuinely needs to
# write -- audited and live-verified one service at a time, not applied
# blanket. `cap_drop`/`pids_limit`/CPU limits (the rest of Q14's original
# scope) remain a separate, not-yet-implemented follow-up. Two real,
# non-obvious problems surfaced doing this, both worth knowing before adding
# a new tmpfs mount to this file:
#   1. Docker's own default tmpfs mount ownership/mode is NOT reliably
#      writable by a non-root container user -- verified live on
#      OpenSearch (root:root 0755, denying its own `opensearch` uid 1000).
#      Every tmpfs mount below is therefore the long `volumes:`-with-
#      `type: tmpfs` form with an explicit `mode:` (the short top-level
#      `tmpfs:` key doesn't accept `mode:` at all), *except* where the
#      `exec` mount option is also needed (Neo4j's /tmp -- JNA's native
#      page-cache library must be mmap-executable, which the long form's
#      schema has no field for at all), which uses the short-form's
#      `path:options` string syntax instead.
#   2. That `mode:` field is NOT parsed as octal digits the way `chmod`/
#      Docker's own CLI tmpfs flags are -- `mode: 1777` (typing what looks
#      like "octal 1777") is instead applied as the literal *decimal*
#      integer 1777 read as a raw 12-bit permission bitmask, producing a
#      bizarre, too-restrictive result and a real crash (verified live via
#      `stat` inside a `docker compose run` shell, and via mysqld's InnoDB
#      failing to open a temp file under it). The fix, used on every tmpfs
#      mount below: supply the *decimal* value that equals the intended
#      octal mode -- octal 01777 (world rwx + sticky bit) is decimal 1023,
#      so `mode: 1023` is what actually appears, not 1777.
# Every read_only change was verified against real functionality, not just
# "container starts": a real query through query_financial_database (mcp_
# sidecar), a real Cube.js measure query (cube), a real Cypher query and
# JMX/Prometheus scrape (neo4j), real catalog data surviving a MySQL/
# OpenSearch/openmetadata_server recreate, and a full `docker compose down`
# + `up -d` bringing all 15 services back healthy with all data intact.

services:
  # ===========================================================================
  # 1. Enterprise Catalog & Metadata Governance (OpenMetadata 1.3.1)
  # ===========================================================================
  openmetadata_db:
    image: mysql:8.0.35
    container_name: openmetadata_mysql
    restart: always
    networks:
      - platform_network
    read_only: true
    # Q14: beyond /var/lib/mysql (already a writable bind mount), mysqld
    # needs two more writable paths that read_only:true would otherwise
    # block: /var/run/mysqld for its Unix socket + PID file (mysqladmin
    # ping in the healthcheck connects over -h 127.0.0.1/TCP, not the
    # socket, but mysqld itself refuses to start without being able to
    # create the socket file), and /tmp for on-disk temp tables/sorts that
    # exceed tmp_table_size (InnoDB genuinely fails to initialize at all
    # without it -- verified live). Both verified to be exactly what's
    # needed -- no more, no less.
    #
    # Every tmpfs mount in this file uses this long `volumes:`-with-
    # `type: tmpfs` form (never the short top-level `tmpfs:` key), and
    # every one sets an explicit `mode:` -- two real, live-discovered
    # problems this works around, not stylistic preference:
    #   1. The short-form `tmpfs: [path]` key doesn't accept a `mode:`
    #      option at all (`docker compose config` rejects it outright),
    #      and its own default ownership isn't reliably writable by a
    #      non-root container user in this Docker install regardless.
    #   2. `mode:` under the long form is NOT parsed as octal digits the
    #      way `chmod`/Docker's own `--tmpfs`/`--mount tmpfs-mode` CLI
    #      flags are -- verified live the hard way: `mode: 1777` (typed
    #      expecting "octal 1777") is instead applied as the *decimal*
    #      integer 1777 read directly as a raw 12-bit permission bitmask,
    #      producing a bizarre and genuinely-too-restrictive
    #      `d-wxrwS--t` (setgid, owner -wx, group rw-, other --t) --
    #      confirmed via `stat` inside a `docker compose run` shell, and
    #      confirmed to crash mysqld's InnoDB init with a real "Permission
    #      denied" writing to /tmp. The fix is to supply the *decimal*
    #      value that equals the intended octal mode: octal 01777 (world
    #      rwx + sticky bit, the permission set Docker's own CLI tmpfs
    #      flags default to) is decimal 1023 -- that is what `mode:` is
    #      set to on every tmpfs mount in this file, not 1777.
    deploy:
      resources:
        limits:
          memory: 768m
    environment:
      - MYSQL_ROOT_PASSWORD=${OPENMETADATA_MYSQL_PASSWORD}
      - MYSQL_DATABASE=openmetadata_db
      - MYSQL_USER=openmetadata_user
      - MYSQL_PASSWORD=${OPENMETADATA_MYSQL_PASSWORD}
    ports:
      # Loopback-only: this port exists for local debugging (e.g. a host mysql
      # client). openmetadata_server itself reaches this container over the
      # default bridge network via the `openmetadata_db` DNS name, not this
      # published port.
      - "127.0.0.1:33060:3306"
    volumes:
      - ./catalog/mysql-data:/var/lib/mysql
      - type: tmpfs
        target: /var/run/mysqld
        tmpfs:
          mode: 1023  # octal 01777 (world rwx + sticky bit) -- see comment above
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 1023  # octal 01777 (world rwx + sticky bit) -- see comment above
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openmetadata_search:
    image: opensearchproject/opensearch:2.11.0
    container_name: openmetadata_search
    restart: always
    networks:
      - platform_network
    read_only: true
    # Q14: this service already had no persistent volume for its index
    # data before this change (Search is a rebuildable projection of
    # MySQL, not this platform's source of truth -- OpenMetadata's own
    # SearchIndexingApplication, triggered by several pipeline scripts,
    # repopulates it), so tmpfs for /usr/share/opensearch/data doesn't
    # change the existing lose-it-on-recreate behavior at all, it just
    # gives OpenSearch a writable place to put what was already ephemeral.
    # /usr/share/opensearch/logs and /tmp are genuinely new requirements
    # read_only:true introduces -- verified live both are needed for the
    # JVM to start at all (log4j2 log file handles, temp heap-related
    # files) and that this exact set (no more, no less) results in a
    # clean start with no permission errors. This image runs as a
    # non-root `opensearch` user (uid 1000), which is what actually
    # surfaced the `mode:` decimal/octal pitfall documented in full on
    # openmetadata_db above (mode: 1023 = octal 01777, NOT the literal
    # "1777" one would naively write) -- a wrong mode here manifested as
    # "Permission denied" writing gc.log/PerformanceAnalyzer.log and a
    # genuine crash loop, not a silent degradation, since this image
    # (unlike MySQL/Grafana's entrypoints) never runs as root at all.
    #
    # A fourth, different-in-kind requirement surfaced after the three
    # tmpfs mounts above: OpenSearch's core bootstrap (independent of
    # DISABLE_SECURITY_PLUGIN, which only covers the *security plugin's*
    # secure settings) unconditionally tries to create an empty
    # opensearch.keystore file under /usr/share/opensearch/config on
    # every startup that doesn't already have one -- verified live via
    # the exact failure: "opensearch.keystore.tmp: Read-only file
    # system". Unlike data/logs/tmp above, config/ can't just be an empty
    # tmpfs -- it also holds the image's real opensearch.yml/jvm.options/
    # log4j2.properties, which a bare tmpfs mount would shadow with
    # nothing. Fixed by extracting the image's own default config/ once
    # into catalog/opensearch-config/ (gitignored, generated -- same
    # pattern as catalog/mysql-data/, see .gitignore) and bind-mounting
    # that directory read-write instead of :ro; verified live that the
    # keystore this creates on first boot is then preserved (not
    # regenerated) on every subsequent restart, since -- unlike
    # data/logs/tmp -- this location isn't tmpfs and isn't lost on
    # container recreate.
    volumes:
      - ./catalog/opensearch-config:/usr/share/opensearch/config
      - type: tmpfs
        target: /usr/share/opensearch/data
        tmpfs:
          mode: 1023  # octal 01777 (world rwx + sticky bit) -- see comment above
      - type: tmpfs
        target: /usr/share/opensearch/logs
        tmpfs:
          mode: 1023  # octal 01777 (world rwx + sticky bit) -- see comment above
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 1023  # octal 01777 (world rwx + sticky bit) -- see comment above
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      - cluster.name=openmetadata-cluster
      - node.name=openmetadata-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      # Loopback-only (see rationale above): openmetadata_server reaches this
      # container over the default bridge network via `openmetadata_search`,
      # not this published port. DISABLE_SECURITY_PLUGIN=true means anyone who
      # can reach this port has unauthenticated read/write access to the
      # catalog's search index, so it must not be published beyond localhost.
      - "127.0.0.1:9200:9200"
    # bootstrap.memory_lock=true above previously had no matching ulimit, so
    # OpenSearch's own mlockall() call failed silently (logged, not fatal) and
    # the JVM heap could still be swapped out under host memory pressure --
    # this is the standard companion setting OpenSearch's own docs recommend.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  openmetadata_server:
    image: openmetadata/server:1.3.1
    container_name: openmetadata_server
    restart: always
    networks:
      - platform_network
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 1023  # octal 01777 -- see openmetadata_db's tmpfs comment
      - type: tmpfs
        target: /opt/openmetadata/logs
        tmpfs:
          mode: 1023  # octal 01777 -- see openmetadata_db's tmpfs comment
    deploy:
      resources:
        limits:
          memory: 1536m
    ports:
      # Previously unqualified ("8585:8585"), which Docker binds to 0.0.0.0 --
      # every other backend port in this file is deliberately loopback-only
      # (see MySQL/OpenSearch above), so this was the one unexplained
      # inconsistency H4 in the hardening plan flagged. Unlike those two raw
      # data ports, though, this *is* the platform's human-facing catalog UI
      # -- there's a legitimate reason someone might want to reach it from
      # another machine on their LAN -- so the fix here is the same pattern
      # already used for MCP_HOST: configurable, secure-by-default (loopback
      # unless deliberately opted out via OPENMETADATA_HOST in .env), rather
      # than silently either-or.
      - "${OPENMETADATA_HOST:-127.0.0.1}:8585:8585"
    environment:
      - DB_HOST=openmetadata_db
      - DB_PORT=3306
      - DB_DRIVER_CLASS=com.mysql.cj.jdbc.Driver
      - DB_SCHEME=mysql
      - DB_USER=openmetadata_user
      # OpenMetadata's own config template (openmetadata.yaml) reads
      # DB_USER_PASSWORD, not DB_PASSWORD -- the latter is silently ignored,
      # which meant this service always fell back to the image's own
      # hardcoded default password ("openmetadata_password") regardless of
      # what was set here. DB_USER_NAME below is similarly unused by the
      # template; kept only for backward compatibility with anything that
      # might read it.
      - DB_USER_PASSWORD=${OPENMETADATA_MYSQL_PASSWORD}
      - DB_USER_NAME=openmetadata_db
      - SEARCH_TYPE=opensearch
      - ELASTICSEARCH_HOST=openmetadata_search
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_SCHEME=http
      - AUTHORIZER_CLASS_NAME=org.openmetadata.service.security.DefaultAuthorizer
      - AUTHENTICATION_PROVIDER=basic
    depends_on:
      openmetadata_db:
        condition: service_healthy
      openmetadata_search:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8585/api/v1/system/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # `openmetadata_search`'s data directory is a tmpfs mount by design (see its
  # own service comment above) -- every container recreate starts with an
  # empty index, and `table_search_index` doesn't exist at all until something
  # repopulates it. Several pipeline scripts already trigger a reindex as a
  # side effect of their own work, which is why a full `bootstrap_platform.sh`
  # run self-heals -- but a bare `docker compose down`/`up`, `restart`, or
  # crash-recreate with no pipeline re-run previously left the catalog
  # searchable via direct ID lookup but broken for `search_data_catalog`/
  # `check_data_quality` (both query via the search index): a real, live-
  # reproduced `HTTP 500 index_not_found_exception`, distinct from the
  # OPENMETADATA_JWT_TOKEN-unset 500 documented in the runbook's Known Issues,
  # with the same visible symptom. This one-shot container closes that gap
  # unconditionally, on every `docker compose up`, not just a full pipeline
  # run -- no custom image needed: bind-mounts the real script (no
  # duplicated logic) and runs it with the stdlib-only interpreter, same
  # digest pin as mcp_server/Dockerfile.mcp for the same base image.
  # Idempotent -- safe to run against an already-fully-indexed catalog.
  openmetadata_search_reindex:
    image: python:3.11-slim@sha256:90744cff8f32887f075c47d747a173ff333e9e98801667af93c357fa9f5e28ff
    container_name: openmetadata_search_reindex
    restart: "no"
    networks:
      - platform_network
    depends_on:
      openmetadata_server:
        condition: service_healthy
    read_only: true
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - OPENMETADATA_URL=http://openmetadata_server:8585/api/v1
      - OPENMETADATA_JWT_TOKEN=${OPENMETADATA_JWT_TOKEN}
      - REINDEX_TIMEOUT_SECONDS=${REINDEX_TIMEOUT_SECONDS:-300}
    volumes:
      - ./scripts:/app/scripts:ro
    working_dir: /app
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    command: ["python3", "scripts/rebuild_search_index.py"]

  # ===========================================================================
  # 2. Knowledge Graph Database (Neo4j 5 Community Edition)
  # ===========================================================================
  neo4j:
    image: neo4j:5.18.0-community
    container_name: neo4j_knowledge_graph
    restart: always
    networks:
      - platform_network
    # H4: bolt (7687) is used by host-run pipeline scripts
    # (build_knowledge_graph.py, hybrid_rag_retriever.py, ...) via
    # NEO4J_URI in .env, which is unchanged (still 127.0.0.1:7687) --
    # publishing preserves that. 7474 (Neo4j Browser) published for direct
    # human access/debugging. The JMX exporter port (9101, see
    # NEO4J_server_jvm_additional below) is deliberately NOT published --
    # only Prometheus, a bridge peer, ever reads it, via the `neo4j:9101`
    # service name.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    read_only: true
    # Q14: the official image's entrypoint, when launched as root (the
    # default), unconditionally `chown -R neo4j:neo4j /var/lib/neo4j`
    # (its own install directory -- jars, binaries, everything) before
    # dropping privileges -- verified live this fails outright under
    # read_only:true (dozens of "Read-only file system" chown errors,
    # crash loop) since that would require the entire image tree to be
    # writable, defeating the point. Launching directly as the image's
    # own neo4j user (uid/gid 7474, confirmed via `id neo4j` inside the
    # image) instead of root skips that chown branch entirely -- verified
    # live this is exactly what the entrypoint's own root-only check
    # gates on, not a workaround that disables something else needed.
    user: "7474:7474"
    deploy:
      resources:
        limits:
          memory: 1536m
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/${NEO4J_PASSWORD}}
      # No script or MCP tool in this repo calls any APOC procedure (verified:
      # zero `apoc.` references outside this file). The plugin was previously
      # installed with EVERY procedure unrestricted, including apoc.load.json/
      # apoc.load.jdbc-style procedures that can reach arbitrary URLs/files --
      # an SSRF/exfiltration surface for no functional benefit. If a future
      # script genuinely needs a specific APOC procedure, re-add the plugin with
      # `NEO4J_dbms_security_procedures_allowlist=apoc.<specific.procedure>`
      # naming only that procedure, not the `apoc.*` wildcard.
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1024m
      # Previously unset, which lets Neo4j auto-size the page cache against
      # *host* RAM rather than this container's 1536m limit -- a likely
      # OOM-kill source on a host with more memory than the container is
      # actually allowed to use. 256m leaves headroom under the 1536m limit
      # alongside the 1024m max heap and the JVM's own overhead.
      - NEO4J_dbms_memory_pagecache_size=256m
      # Phase 4 (Part 5 item 3): Neo4j Community has no built-in Prometheus
      # reporter (Enterprise-only -- verified live, see
      # neo4j_jmx_agent_init's comment below). NEO4J_server_jvm_additional is
      # documented/verified to *append* to the image's own default JVM flags
      # (G1GC, AlwaysPreTouch, etc.), not replace them -- confirmed live via
      # `ps aux` showing both the shipped flags and this one together. Binds
      # the exporter's own HTTP listener to 0.0.0.0 (H4: this port is never
      # published to the host -- see the `ports:` comment above -- so
      # 0.0.0.0 here only means "reachable by other containers on
      # platform_network", i.e. Prometheus, not "reachable from the LAN";
      # binding 127.0.0.1 here, this container's *own* loopback, would make
      # it unreachable even from Prometheus, a bridge peer). The JMX RMI
      # port itself never leaves the JVM process either way.
      - NEO4J_server_jvm_additional=-javaagent:/jmx_exporter_agent/jmx_prometheus_javaagent.jar=0.0.0.0:9101:/jmx_exporter/config.yml
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
      # Named volume mounted as a directory (not a single-file mount -- a
      # volume mount always presents as a directory), containing the jar
      # neo4j_jmx_agent_init downloaded.
      - jmx_exporter_agent:/jmx_exporter_agent:ro
      - ./catalog/neo4j_jmx_exporter_config.yml:/jmx_exporter/config.yml:ro
      - type: tmpfs
        target: /var/lib/neo4j/conf
        tmpfs:
          mode: 1023  # octal 01777 -- see openmetadata_db's tmpfs comment
      - type: tmpfs
        target: /var/lib/neo4j/run
        tmpfs:
          mode: 1023  # octal 01777 -- see openmetadata_db's tmpfs comment
    # /tmp specifically needs the short-form `path:options` string here,
    # not the long `volumes:`-with-`type: tmpfs` form used everywhere
    # else in this file -- that long form's schema only accepts `size`/
    # `mode`, with no way to request the `exec` mount option, and Neo4j's
    # JVM genuinely needs it: JNA (used for native page-cache memory
    # allocation) extracts and mmaps a native .so into /tmp at startup,
    # which fails with "failed to map segment from shared object" against
    # Docker's own tmpfs default of `noexec` -- verified live to be
    # exactly this cause, not a mode/ownership problem (mode alone,
    # correctly applied, still hit this error). This is the one tmpfs
    # mount in the whole file that genuinely needs exec; every other
    # service's tmpfs mounts are deliberately left at Docker's safer
    # noexec default.
    tmpfs:
      - /tmp:exec,mode=1777
    depends_on:
      neo4j_jmx_agent_init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # 3. Open-Source Semantic Layer (Cube.js Engine + Cube Store)
  # ===========================================================================
  # H1 (hardening plan): standalone Cube Store service, added specifically to
  # unblock CUBEJS_DEV_MODE=false below -- production mode requires a real
  # cache/queue driver (CUBEJS_CUBESTORE_HOST/PORT); dev mode's bundled
  # `cubestore-dev` (still used by H3/D9's pre_aggregations work in earlier
  # phases) only exists inside a dev-mode `cube` process. Single-instance,
  # non-clustered Cube Store -- upstream's own docs call this "usually
  # unsuitable for production," but that's exactly the same single-operator
  # local-PoC scale tradeoff already accepted throughout this platform (single
  # Postgres instance, single Neo4j instance, no HA anywhere); a real
  # multi-node router/worker Cube Store cluster would be disproportionate.
  # All three of its ports (HTTP for cube's own queries, MySQL-wire, and the
  # status probe) are genuine, working env vars, not guessed from partial
  # docs (verified live via `grep -a -o 'CUBESTORE_[A-Z_]*'` against the
  # binary). H4: none of these three are published to the host at all --
  # only `cube`, a bridge peer on platform_network, ever talks to this
  # service, via the `cubestore` service name.
  cubestore:
    image: cubejs/cubestore:v1.7.17
    container_name: cube_store
    restart: always
    networks:
      - platform_network
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    deploy:
      resources:
        limits:
          memory: 768m
    environment:
      # H4: 0.0.0.0, not 127.0.0.1 -- this is the container's *own*
      # loopback under bridge networking, unreachable even from `cube`, a
      # peer on the same platform_network (see the module comment above
      # for why H4's original loopback-only pattern doesn't carry over
      # unchanged). No `ports:` entry publishes any of these to the host,
      # so "0.0.0.0" here means "reachable by bridge peers," not "exposed
      # to the LAN."
      - CUBESTORE_HTTP_BIND_ADDR=0.0.0.0:3030
      - CUBESTORE_BIND_ADDR=0.0.0.0:3306
      - CUBESTORE_STATUS_BIND_ADDR=0.0.0.0:3031
      - CUBESTORE_TELEMETRY=false
    volumes:
      # Persists metastore + partition data across container recreates --
      # same reasoning as prometheus_data/grafana_data (Q14): without this,
      # every pre_aggregation rollup silently rebuilds from scratch on
      # every restart, not data loss (a regenerable cache) but real,
      # avoidable rebuild cost.
      - cubestore_data:/cube/.cubestore
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      # /readyz confirmed live to return 200 (verified every other path
      # under the status port 404s except /readyz and /livez), but this
      # image has neither wget nor curl (verified live: only Debian
      # coreutils/bash) -- so the check is a bash /dev/tcp connect against
      # the status port instead of an HTTP request, same class of
      # TCP-reachability check mcp_sidecar's own healthcheck uses for the
      # identical "no HTTP client available" reason.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/3031"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  cube:
    image: cubejs/cube:v0.35
    container_name: cube_semantic_layer
    restart: always
    networks:
      - platform_network
    # H4: reaches the host-run Postgres (see D1 -- not a compose service)
    # via host.docker.internal instead of 127.0.0.1, now that this
    # container has its own network namespace. Required explicitly on
    # Linux (Docker Desktop on macOS/Windows provides this automatically);
    # verified live it resolves and connects on this host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 4000 published for host-run script/human access (CUBEJS_URL in
    # .env, unchanged, still 127.0.0.1:4000) -- mcp_sidecar, a bridge
    # peer, reaches this via the `cube:4000` service name instead,
    # regardless of this publish.
    ports:
      - "127.0.0.1:4000:4000"
    read_only: true
    # H1: production mode (CUBEJS_REFRESH_WORKER=true below) writes
    # temporary CSV export/import staging files to /tmp while building
    # pre_aggregations -- dev mode's embedded cubestore-dev never needed
    # this (the old cube_store_data mount at /cube/conf/.cubestore covered
    # its own, different write path). Verified live: without this, every
    # pre-aggregation build failed with "EROFS: read-only file system,
    # open '/tmp/<hash>'". Short-form `path:options` string (same as
    # neo4j's /tmp below, for the same reason: the long `volumes:`-with-
    # `type: tmpfs` form used elsewhere in this file works too here, but
    # this form's `mode=1777` is parsed as real octal directly, unlike
    # that form's `mode:` field -- see Q14's tmpfs-mode comment on
    # openmetadata_db for the full decimal-vs-octal explanation).
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      cubestore:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    environment:
      - CUBEJS_DB_TYPE=postgres
      # H4: hardcoded, not ${POSTGRES_HOST:-127.0.0.1} -- .env's
      # POSTGRES_HOST default is correct for host-run scripts (which
      # still reach Postgres over the host's real loopback), but this
      # container needs host.docker.internal (see extra_hosts above)
      # specifically, which reading .env's own default would not give it.
      - CUBEJS_DB_HOST=host.docker.internal
      - CUBEJS_DB_PORT=54322
      - CUBEJS_DB_NAME=${POSTGRES_DB:-postgres}
      # H1: connects as the least-privilege cube_readonly role (see
      # supabase/migrations/20260808150000_create_cube_readonly_role.sql),
      # not the postgres superuser this previously defaulted to -- Cube.js
      # only ever issues SELECT queries against financial/ref; superuser
      # was never functionally required. A deliberate sibling of C2's
      # mcp_readonly, not a shared login -- see the migration's own comment.
      - CUBEJS_DB_USER=${CUBE_PG_READONLY_USER:-cube_readonly}
      - CUBEJS_DB_PASS=${CUBE_PG_READONLY_PASSWORD}
      - CUBEJS_DB_SCHEMA=financial
      - CUBEJS_PORT=4000
      # No CUBEJS_SQL_PORT: the Postgres-wire SQL API it would open has no
      # equivalent to cube.js's checkAuth (there's no CUBEJS_SQL_USER/
      # CUBEJS_SQL_PASSWORD configured), and nothing in this repo uses it --
      # leaving it enabled meant an unauthenticated query interface to the
      # semantic layer on a network_mode: host port.
      # H1: CUBEJS_DEV_MODE=false, now that the cubestore service above
      # gives production mode a real cache/queue driver to talk to
      # (CUBEJS_CUBESTORE_HOST/PORT below) -- verified live: the Developer
      # Playground is gone (production mode's own behavior, not a separate
      # toggle), and checkAuth's role-based enforcement (see cube/cube.js)
      # is unaffected -- it was already enforced in both modes before this
      # flip. A real, live-discovered gap this flip introduced: dev mode
      # auto-builds a pre_aggregation's partitions on first query; without
      # a refresh worker, production mode does not, so the 4 rollups from
      # H3/D9 failed with "No pre-aggregation partitions were built yet"
      # on every query until CUBEJS_REFRESH_WORKER=true below -- the
      # documented single-node pattern (same instance also acts as its own
      # refresh worker) rather than a separate refresh-worker container,
      # consistent with this being a single-operator local PoC, not a
      # multi-node deployment.
      - CUBEJS_DEV_MODE=false
      # H4: the cubestore service name, not 127.0.0.1 -- cubestore is a
      # separate container on the same platform_network now, not a
      # process sharing this one's network namespace.
      - CUBEJS_CUBESTORE_HOST=cubestore
      - CUBEJS_CUBESTORE_PORT=3030
      - CUBEJS_REFRESH_WORKER=true
      # H1: two real, independently-issued roles (see cube/cube.js's
      # checkAuth/queryRewrite) instead of one shared secret granting every
      # cube -- CUBEJS_API_SECRET is the privileged role (used by
      # mcp_sidecar/hybrid_rag_retriever.py, includes AML-risk-restricted
      # cubes/measures); CUBEJS_API_SECRET_RESTRICTED is a second, real
      # token for general BIAN/FIBO access without AML risk classifications.
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
      - CUBEJS_API_SECRET_RESTRICTED=${CUBEJS_API_SECRET_RESTRICTED}
      - CUBEJS_TELEMETRY=false
    volumes:
      # :ro -- cube.js in particular *is* the auth implementation
      # (checkAuth); nothing running inside this container has a legitimate
      # reason to modify either mount (Q14).
      - ./cube/model:/cube/conf/model:ro
      - ./cube/cube.js:/cube/conf/cube.js:ro
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/readyz', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ===========================================================================
  # 4. Live Prometheus & Grafana Observability Suite
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus_metrics
    restart: always
    networks:
      - platform_network
    # H4: published for host/human UI access, unchanged address
    # (127.0.0.1:9090); every scrape target below and the `alerting:`
    # block in catalog/prometheus.yml now use service names instead
    # (`mcp_sidecar:8000`, `node_exporter:9100`, ...), since those targets
    # are all bridge peers now, not processes sharing this container's
    # network namespace.
    ports:
      - "127.0.0.1:9090:9090"
    read_only: true
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - ./catalog/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # rule_files: "prometheus_rules.yml" in prometheus.yml resolves relative
      # to /etc/prometheus/ (the config file's own directory), so this needs
      # its own mount alongside prometheus.yml, not just a volumes: entry.
      - ./catalog/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
      # Previously no volume at all for /prometheus -- every metric sample,
      # not just dashboards/alerts, was destroyed on container recreate
      # (Q14). Named volume rather than a bind mount: the image runs as a
      # fixed non-root UID (nobody, 65534) that doesn't necessarily match
      # any host user, so a bind mount risks a permission mismatch a named
      # volume (Docker-managed ownership) avoids.
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    # Upgraded from 10.4.0 to 13.1.3 (2026-08-08) specifically to fix the
    # Tempo datasource's health-check false negative -- verified live via a
    # throwaway container against this same real Tempo instance that
    # 10.4.0's bundled Tempo plugin binary genuinely returns
    # "plugin.notImplemented" for CheckHealth (the plugin's own upstream
    # source, grafana/grafana-tempo-datasource, does implement a real check
    # against Tempo's /api/echo endpoint -- 10.4.0 just bundles a build
    # that predates it), while 13.1.3's bundled build returns a real
    # "Data source is working" / OK against the identical Tempo instance.
    # The Alertmanager datasource's own health-check gap is a separate,
    # permanent Grafana limitation this upgrade does NOT fix (confirmed via
    # the same throwaway-container test, and via the real upstream issue
    # grafana/grafana#83794, closed "Not planned") -- its plugin.json has
    # no `backend` key at all, so there's no backend plugin for Grafana's
    # generic health-check endpoint to route the call to, at any version.
    image: grafana/grafana:13.1.3
    container_name: grafana_observability_dashboard
    restart: always
    networks:
      - platform_network
    # H4: published for host/human UI access, unchanged address
    # (127.0.0.1:3000); its 3 datasources
    # (catalog/grafana/provisioning/datasources/*.yml) now point at
    # `prometheus`/`tempo`/`alertmanager` service names instead of
    # 127.0.0.1, since all three are bridge peers now.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    # Q14: the image's own default GF_PATHS_LOGS=/var/log/grafana isn't
    # covered by the grafana_data volume (that's only /var/lib/grafana) --
    # verified live that without this, the container still starts and
    # serves requests (its console/stdout logger, the one docker logs
    # actually captures, doesn't depend on the file logger succeeding),
    # but the file logger itself silently no-ops on every write
    # ("Read-only file system", confirmed via a live `touch` inside the
    # container). Added below as a `volumes:`-with-`type: tmpfs` entry
    # (merged into the existing `volumes:` list) with mode: 1023 (= octal
    # 01777) -- see openmetadata_db's tmpfs comment for the full
    # decimal-vs-octal `mode:` pitfall this value works around.
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./catalog/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./catalog/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./catalog/grafana/dashboards:/etc/grafana/dashboards:ro
      # Previously no volume at all for /var/lib/grafana -- every dashboard
      # edit, annotation, and API key was destroyed on container recreate,
      # not just the provisioned-from-disk dashboards (Q14). Named volume
      # for the same host-UID-mismatch reason as Prometheus's, above.
      - grafana_data:/var/lib/grafana
      - type: tmpfs
        target: /var/log/grafana
        tmpfs:
          mode: 1023  # octal 01777 (world rwx + sticky bit) -- see comment above
      # Added with the 13.1.3 upgrade above -- 10.4.0 never needed this.
      # Newer Grafana bundles several additional plugins (elasticsearch,
      # zipkin, and a handful of "app" plugins like
      # grafana-lokiexplore-app/grafana-pyroscope-app) that run their own
      # background installer/updater at startup, which tries to write a
      # staging file under /tmp regardless of whether the plugin is
      # actually used -- confirmed live: without this, startup logs fill
      # with "open /tmp/pluginNNN: read-only file system" for each one.
      # None of those plugins are used by this platform (Tempo/Prometheus/
      # Alertmanager are the only datasources provisioned), so this isn't
      # fixing a real capability gap, just quieting startup noise from
      # bundled-but-unused plugins failing to self-update against a
      # deliberately read-only filesystem.
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 1023  # octal 01777 (world rwx + sticky bit) -- see comment above
    depends_on:
      prometheus:
        condition: service_healthy
      # tempo has no healthcheck to wait on (see the comment above the
      # tempo/otel_collector services) -- service_started just waits for the
      # container to launch. Grafana tolerates a datasource that isn't ready
      # yet at its own startup regardless (marks it unhealthy in the UI,
      # doesn't crash), so this is a minor startup-ordering nicety, not a
      # correctness requirement the way the prometheus dependency is.
      tempo:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # No standalone telemetry_exporter service -- it used to run
  # scripts/telemetry_metrics_exporter_server.py (removed) as a *separate*
  # container that could never see traces recorded by mcp_sidecar, since
  # Prometheus client metrics live in-process; it was seeded with
  # `random.uniform()` fake data because there was no way to feed it anything
  # real. mcp_sidecar below now serves genuine metrics on :8000 itself, from
  # the same process that executes tool calls.

  # ===========================================================================
  # 4b. Real Distributed Tracing (OTel Collector + Tempo) -- Part 5 item 2 in
  # the hardening plan. scripts/_otel_tracing.py exports real spans (per MCP
  # tool call, per hybrid-RAG tier) via OTLP to otel_collector, which
  # forwards to tempo for storage; tempo is then queryable as a Grafana
  # datasource (trace waterfalls, TraceQL) alongside the existing Prometheus
  # metrics datasource. Both fail open by design -- a tool call must never
  # break because tracing infrastructure is down (see
  # scripts/_otel_tracing.py's own docstring); neither service is a hard
  # `depends_on` for mcp_sidecar for exactly that reason, unlike neo4j/cube
  # above, which mcp_sidecar's actual data queries need to be useful at all.
  # ===========================================================================
  # Neither service below has a `healthcheck:` -- both images are deliberately
  # minimal/distroless (verified: neither ships a shell, wget, curl, or nc;
  # `docker run --entrypoint sh ... ` fails with "executable file not found"
  # on both), a legitimate size/attack-surface tradeoff that comes at the
  # cost of not being able to express a Docker-native healthcheck without
  # adding tooling neither upstream image intends to carry. `restart: always`
  # is the resilience mechanism instead; `depends_on` below uses
  # `service_started` (container process launched) rather than
  # `service_healthy` (no such signal exists to wait on).
  tempo:
    image: grafana/tempo:3.0.2
    container_name: tempo_tracing_backend
    restart: always
    networks:
      - platform_network
    # H4: 3200 (query API) published for host debugging/verification and
    # because Grafana's Tempo datasource previously (pre-migration) relied
    # on host-reachability; Grafana now reaches it via the `tempo` service
    # name instead, but publishing costs nothing and preserves direct
    # `curl 127.0.0.1:3200/...` access. The OTLP receiver ports
    # (4319/4320) are NOT published -- only otel_collector, a bridge peer,
    # ever sends to them.
    ports:
      - "127.0.0.1:3200:3200"
    read_only: true
    deploy:
      resources:
        limits:
          memory: 512m
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./catalog/tempo.yaml:/etc/tempo.yaml:ro
      # Named volume, not a bind mount -- same host-UID-mismatch reasoning as
      # prometheus_data/grafana_data above (the image runs as a fixed
      # non-root UID).
      - tempo_data:/var/tempo
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  otel_collector:
    image: otel/opentelemetry-collector:0.158.0
    container_name: otel_collector
    restart: always
    networks:
      - platform_network
    # H4: OTLP receiver ports published, unchanged addresses
    # (127.0.0.1:4317/4318) -- host-run scripts (scripts/_otel_tracing.py,
    # used by scripts/hybrid_rag_retriever.py when run directly on the
    # host, not just by the containerized mcp_sidecar) send spans here via
    # .env's OTEL_EXPORTER_OTLP_ENDPOINT, unchanged. mcp_sidecar, a bridge
    # peer, reaches this via the `otel_collector` service name instead,
    # regardless of this publish.
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    read_only: true
    deploy:
      resources:
        limits:
          memory: 256m
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./catalog/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Phase 4 (hardening plan, Part 5 item 3): real host/service exporters, so
  # Prometheus has more than 2 scrape targets (itself + mcp_sidecar) to alert
  # on. H4: each publishes its metrics port to 127.0.0.1 on the host
  # (unchanged addresses, direct debug access preserved) while binding
  # 0.0.0.0 internally so Prometheus, a bridge peer, can also scrape it via
  # its service name -- neither of these have any auth of their own, so
  # loopback-only host publishing (not 0.0.0.0:<port>:<port>) is what
  # actually keeps them off the LAN now, the same property H4's original
  # bind-to-127.0.0.1-inside-the-container pattern provided under host
  # networking.
  # ---------------------------------------------------------------------------
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: always
    networks:
      - platform_network
    # `pid: host` (needed to see host processes/mounts) is independent of
    # network mode -- this and the host bind mounts below are unaffected
    # by the H4 migration.
    pid: host
    read_only: true
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--web.listen-address=0.0.0.0:9100"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    restart: always
    networks:
      - platform_network
    # H4: reaches the host-run Postgres (D1 -- not a compose service) via
    # host.docker.internal instead of 127.0.0.1 -- see `cube`'s identical
    # comment for why this needs an explicit extra_hosts entry on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    ports:
      - "127.0.0.1:9187:9187"
    deploy:
      resources:
        limits:
          memory: 128m
    environment:
      # Connects as mcp_readonly (C2's least-privilege role), not the
      # superuser -- consistent with every other read path in this platform.
      # Verified live: every collector works under mcp_readonly except `wal`
      # (needs pg_ls_waldir(), a superuser-only function), disabled below
      # rather than widening the role's grants for a metrics nicety.
      # H4: host.docker.internal, not 127.0.0.1 -- see extra_hosts above.
      - DATA_SOURCE_NAME=postgresql://${MCP_PG_READONLY_USER:-mcp_readonly}:${MCP_PG_READONLY_PASSWORD}@host.docker.internal:54322/${POSTGRES_DB:-postgres}?sslmode=disable
    command:
      - "--web.listen-address=0.0.0.0:9187"
      - "--no-collector.wal"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld_exporter
    restart: always
    networks:
      - platform_network
    read_only: true
    ports:
      - "127.0.0.1:9104:9104"
    # Q14 (container capability hardening): the entrypoint below writes
    # /tmp/.my.cnf at every startup, so read_only:true needs an explicit
    # writable tmpfs for /tmp -- the one path this container genuinely
    # needs to write to, sized just large enough for that one small
    # generated credentials file and gone on every restart (never
    # persisted to a volume, consistent with the "never commit a
    # credential file" reasoning below). Uses the long `volumes:`-with-
    # `type: tmpfs` form with mode: 1023 (= octal 01777) -- see
    # openmetadata_db's tmpfs comment for why, and for the
    # decimal-vs-octal `mode:` pitfall that value works around.
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          mode: 1023  # octal 01777 (world rwx + sticky bit) -- see comment above
    deploy:
      resources:
        limits:
          memory: 128m
    environment:
      - MYSQLD_EXPORTER_USER=openmetadata_user
      - MYSQLD_EXPORTER_PASSWORD=${OPENMETADATA_MYSQL_PASSWORD}
    # v0.15.x removed DATA_SOURCE_NAME env-var support (upstream: credentials
    # visible via `docker inspect`/`ps` otherwise) in favor of a `.my.cnf`
    # file read at startup -- verified live, DATA_SOURCE_NAME alone now fails
    # with "no user specified in section or parent". This generates that file
    # inside the container's own ephemeral filesystem from the env vars
    # above (themselves sourced from .env, never hardcoded) rather than
    # committing any credential file to the repo.
    entrypoint: ["/bin/sh", "-c"]
    # H4: host=openmetadata_db (the bridge peer's service name), port=3306
    # (its real internal MySQL port) -- previously host=127.0.0.1,
    # port=33060, which only worked because network_mode: host meant this
    # container shared openmetadata_db's *published debug port* on the
    # host's own loopback; now that both are separate containers on
    # platform_network, this connects directly to openmetadata_db's own
    # port instead of routing through its host-facing debug publish.
    command:
      - |
        printf '[client]\nuser=%s\npassword=%s\nhost=openmetadata_db\nport=3306\n' "$$MYSQLD_EXPORTER_USER" "$$MYSQLD_EXPORTER_PASSWORD" > /tmp/.my.cnf &&
        exec mysqld_exporter --web.listen-address=0.0.0.0:9104 --config.my-cnf=/tmp/.my.cnf --no-collect.slave_status
    depends_on:
      openmetadata_db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9104/metrics"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: always
    networks:
      - platform_network
    read_only: true
    ports:
      - "127.0.0.1:8081:8081"
    deploy:
      resources:
        limits:
          memory: 256m
    # docker.sock mounted :ro -- but be clear-eyed about what that actually
    # buys: the :ro flag only stops this container from *replacing* the
    # socket file, not what it can do over it. Any process with access to
    # the Docker socket can ask the daemon to run a new container with an
    # arbitrary host bind mount, which is root-equivalent host access -- the
    # exact class of exposure C6 deliberately removed from the pipeline
    # scripts' `docker exec` usage. cAdvisor itself only issues read-only
    # `docker stats`-style API calls and is the standard, plan-recommended
    # OSS answer for container metrics; accepted here as a deliberate,
    # documented tradeoff for a single-operator local PoC, not a production
    # posture -- do not add this mount to a multi-tenant or internet-facing
    # deployment without re-evaluating it.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # H4: 0.0.0.0, not 127.0.0.1 -- see the exporters' group comment
      # above for why (this port isn't published beyond 127.0.0.1 on the
      # host regardless, via the `ports:` entry above).
      - "--listen_ip=0.0.0.0"
      - "--port=8081"
      - "--docker_only=true"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    # KNOWN LIMITATION, discovered live and left unresolved rather than
    # hidden: cAdvisor logs "failed to identify the read-write layer ID"
    # for every real container and never populates per-container labels
    # (`name`, `id=/docker/<hash>`) -- only the aggregate root cgroup
    # (`id="/"`) is queryable. Root-caused to this environment's
    # `/var/lib/docker` (bind-mounted into cadvisor) not corresponding to
    # the overlayfs layer metadata the actual dockerd process uses --
    # confirmed this is not a permissions problem: retried with
    # `--privileged` and the identical errors persisted, then reverted
    # `--privileged` since it bought nothing here and is a real capability
    # widening not worth keeping for zero benefit. `prometheus_rules.yml`'s
    # container alert is written against the aggregate metric this actually
    # does expose (whole-machine container memory), not a per-container one
    # that would silently never fire. On a host where cAdvisor's normal
    # per-container discovery works, this same config should populate real
    # per-container series with no changes needed.

  # Phase 4: a one-shot init container that downloads the Apache-2.0
  # `jmx_prometheus_javaagent` jar (pinned exact version + sha256, unlike C3's
  # original NEO4J_PLUGINS finding) into a shared named volume the `neo4j`
  # service below mounts read-only. Committing the ~570KB binary jar to git
  # was considered and rejected in favor of this -- consistent with how
  # NEO4J_PLUGINS already fetches APOC at container start rather than
  # vendoring it, just with the version pin and checksum verification C3
  # noted was missing there. Runs once per `docker compose up`; the volume
  # persists the jar across restarts, so this only needs network access on
  # the very first bootstrap of a fresh environment.
  #
  # Q14 (container capability hardening): deliberately NOT given
  # `read_only: true`, unlike every other service in this file. `apk add
  # --no-cache wget` below needs to write its package database and cache
  # across a scattered set of real image paths (/var/cache/apk,
  # /lib/apk/db, /etc/apk, plus wherever it installs the wget binary
  # itself) -- covering all of them with tmpfs would mean making most of
  # this Alpine image's own filesystem writable, which defeats the point
  # of read_only for essentially no benefit here: this container is
  # one-shot (`restart: "no"`), runs for a few seconds per fresh
  # environment bootstrap (skips entirely via the existing-jar check
  # below on every later `docker compose up`), and the one thing it
  # writes that actually persists (the downloaded jar) already goes to a
  # dedicated named volume with an explicit sha256 check, not this
  # container's own writable layer. A reasoned, documented exception, the
  # same spirit as the accepted-limitation items in the runbook's Known
  # Issues section -- not an oversight.
  neo4j_jmx_agent_init:
    image: alpine:3.20
    container_name: neo4j_jmx_agent_init
    restart: "no"
    networks:
      - platform_network
    volumes:
      - jmx_exporter_agent:/agent
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /agent/jmx_prometheus_javaagent.jar ]; then
          echo "jmx_prometheus_javaagent.jar already present, skipping download."
          exit 0
        fi
        apk add --no-cache wget >/dev/null
        wget -qO /agent/jmx_prometheus_javaagent.jar \
          https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar
        echo "8b67ed40485d475648c36d11d21464b484406f85faf912b3363f71a6a7861320  /agent/jmx_prometheus_javaagent.jar" | sha256sum -c -

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: always
    networks:
      - platform_network
    read_only: true
    # H4: published for host/human UI access, unchanged address
    # (127.0.0.1:9093); Prometheus's `alerting:` block and Grafana's
    # Alertmanager datasource both now reach this via the `alertmanager`
    # service name instead -- this is *why* alertmanager had to move to
    # bridge networking alongside the 5 originally-named services rather
    # than staying on host+loopback-bound: once Grafana is a bridge
    # container, it cannot reach a service bound to 127.0.0.1 on the host
    # at all (see this file's top-of-file H4 comment for the full
    # reasoning).
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          memory: 128m
    volumes:
      - ./catalog/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===========================================================================
  # 5. FastMCP Agentic Protocol Sidecar Container Service
  # ===========================================================================
  mcp_sidecar:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile.mcp
    container_name: mcp_agentic_sidecar
    restart: always
    networks:
      - platform_network
    # H4: reaches the host-run Postgres (D1 -- not a compose service) via
    # host.docker.internal instead of 127.0.0.1 -- see `cube`'s identical
    # comment for why this needs an explicit extra_hosts entry on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    # H4: ${MCP_HOST:-127.0.0.1} here controls the *host-side* publish
    # interface only (same pattern as OPENMETADATA_HOST for
    # openmetadata_server) -- not this container's own internal bind
    # address, which is hardcoded to 0.0.0.0 below regardless of what
    # MCP_HOST resolves to, since Docker's own port-forwarding (and
    # Prometheus, a bridge peer, scraping :8000) both require it. See the
    # `environment:` block below and
    # mcp_server/financial_data_mcp_server.py's own comment on MCP_HOST's
    # dual meaning (host-run vs. containerized).
    ports:
      - "${MCP_HOST:-127.0.0.1}:8001:8001"
      - "${MCP_HOST:-127.0.0.1}:8000:8000"
    deploy:
      resources:
        limits:
          memory: 512m
    # Previously no depends_on at all, so startup order against the two
    # compose-internal services this container actually queries (Neo4j,
    # Cube.js) was undefined -- it still self-heals either way (query_pg/
    # query_neo4j fail per-call and log, they don't crash the process), but
    # there's no reason to let it start racing them when compose can express
    # the real dependency. PostgreSQL/Supabase is not expressible here since
    # it isn't a compose service at all -- see D1/CLAUDE.md.
    depends_on:
      neo4j:
        condition: service_healthy
      cube:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8001
      - MCP_METRICS_PORT=8000
      # Q14: no code in mcp_server/ writes to disk (grepped -- only
      # urllib.request.urlopen network calls), but Python itself wants to
      # write __pycache__/*.pyc bytecode caches on first import; verified
      # live that under read_only:true alone it silently falls back to
      # interpreting from source every time (no crash, just a repeated
      # warm-up cost on every restart) -- this makes that an explicit,
      # documented choice instead of a silent degradation.
      - PYTHONDONTWRITEBYTECODE=1
      - MCP_API_KEY=${MCP_API_KEY}
      # H4: hardcoded 0.0.0.0, NOT ${MCP_HOST:-127.0.0.1} -- this is the
      # container's own internal bind address (read by
      # mcp_server/financial_data_mcp_server.py's `main()`), a genuinely
      # different thing from the `ports:` block's host-publish-interface
      # use of the same env var name above. Reading .env's MCP_HOST here
      # too would very likely give the wrong value: .env's own default
      # (127.0.0.1) is meant for a host-run SSE instance, and binding this
      # container to its own loopback would make it unreachable by
      # Docker's port-forwarding and by Prometheus (a bridge peer) alike.
      - MCP_HOST=0.0.0.0
      # H4: hardcoded host.docker.internal -- see extra_hosts above. .env's
      # own POSTGRES_HOST default (127.0.0.1) is correct for host-run
      # scripts and is left unchanged; reading it here via
      # ${POSTGRES_HOST:-127.0.0.1} would resolve to this container's own
      # loopback instead of the real host.
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=54322
      # Connects as the least-privilege mcp_readonly role, not the postgres
      # superuser -- see the comment above POSTGRES_USER in
      # mcp_server/financial_data_mcp_server.py for why.
      - MCP_PG_READONLY_USER=${MCP_PG_READONLY_USER:-mcp_readonly}
      - MCP_PG_READONLY_PASSWORD=${MCP_PG_READONLY_PASSWORD}
      # H4: neo4j/cube/openmetadata_server/otel_collector below are all
      # hardcoded to their bridge service names, not read from `.env` via
      # a `${VAR:-...}` fallback -- those `.env` defaults are for host-run
      # scripts (still correct, unchanged, still 127.0.0.1-based) and
      # would resolve to the wrong address if read here instead.
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - CUBEJS_URL=http://cube:4000/cubejs-api/v1/load
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
      - OPENMETADATA_URL=http://openmetadata_server:8585/api/v1
      - OPENMETADATA_JWT_TOKEN=${OPENMETADATA_JWT_TOKEN}
      # This image doesn't install sentence-transformers/torch (see .env.example's
      # comment) -- hybrid_rag_search fails closed by default rather than
      # silently degrading. Leave unset/0 unless you deliberately want degraded
      # (clearly-tagged) retrieval instead.
      - ALLOW_DEGRADED_EMBEDDINGS=${ALLOW_DEGRADED_EMBEDDINGS:-0}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      # Real distributed-tracing spans -- see scripts/_otel_tracing.py.
      # H4: otel_collector is a bridge peer now, reached by its service
      # name -- not 127.0.0.1, which used to work only because this
      # container shared its network namespace under host networking.
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel_collector:4317
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-ai-dataplatform-mcp-server}

volumes:
  # Named (not bind-mounted): both images run as a fixed non-root UID that
  # doesn't necessarily match any host user, so Docker-managed ownership
  # avoids a permission mismatch a bind mount would risk.
  prometheus_data:
  grafana_data:
  tempo_data:
  # H1: renamed from cube_store_data (dev-mode's bundled cubestore-dev
  # inside the `cube` container itself, now unused now that CUBEJS_DEV_MODE
  # is false) to cubestore_data, mounted into the new standalone
  # `cubestore` service instead. The old volume's cached rollup data is not
  # migrated -- it's a regenerable cache (same reasoning as the original
  # comment on this volume), not data loss.
  cubestore_data:
  jmx_exporter_agent:
  alertmanager_data:

# H4: the one user-defined bridge network every service in this file now
# joins, replacing `network_mode: "host"` on the 13 services that used to
# have it. A single flat network (not per-tier subnets) -- this is a
# single-node PoC stack where every service already implicitly trusted
# every other one under host networking (shared namespace, no firewalling
# between them at all); a bridge network's own container-to-container
# isolation from the rest of the host/LAN is the entire security
# improvement being made here, not additional segmentation *between* these
# services.
networks:
  platform_network:
    driver: bridge

