version: "1.0.0"
kind: DataContract
id: urn:datacontract:financial_platform:loan_credit_risk_domain
dataset: Loan_Credit_Risk_Data_Product
name: Loan & Credit Risk Data Product Contract
status: active
domain: Loan & Credit Risk Domain
owner:
  name: Credit Risk & Capital Management Data Team
  email: credit-risk-team@financial-platform.com

sla:
  freshness: "1 hour"
  availability: "99.9%"
  retention: "10 years (Basel III/IV Compliance)"
  data_quality_score: ">= 99.0%"

models:
  financial.loan_agreement:
    description: BIAN Loan Product Contract & Principal
    type: table
    columns:
      loan_agreement_id:
        type: UUID
        primary_key: true
        nullable: false
      agreement_number:
        type: VARCHAR
        nullable: false
      principal_amount:
        type: NUMERIC
        nullable: false
      interest_rate:
        type: NUMERIC
        nullable: false
      agreement_status:
        type: VARCHAR
        nullable: false
        allowed_values: ["ACTIVE", "DEFAULTED", "PAID_OFF"]

  financial.loan_collateral:
    description: Pledged Collateral Asset & Valuation
    type: table
    columns:
      loan_collateral_id:
        type: UUID
        primary_key: true
        nullable: false
      collateral_type:
        type: VARCHAR
        nullable: false
      estimated_value:
        type: NUMERIC
        nullable: false

  # D2: three tables added 2026-08-08 to close this contract's coverage gap
  # (previously 2 of the 5 real Loan & Credit Risk Domain tables) -- columns,
  # types, and allowed_values below verified directly against
  # supabase/migrations/20260722000000_create_financial_platform_schema.sql.
  financial.loan_application:
    description: Loan Origination & Credit Application Lifecycle
    type: table
    columns:
      loan_application_id:
        type: UUID
        primary_key: true
        nullable: false
      application_number:
        type: VARCHAR
        nullable: false
        description: "Business key: Application reference number"
      requested_amount:
        type: NUMERIC
        nullable: false
      application_status:
        type: VARCHAR
        nullable: false
        allowed_values: ["SUBMITTED", "UNDERWRITING", "APPROVED", "REJECTED"]

  financial.loan_disbursement:
    description: Loan Principal Disbursement Execution Events
    type: table
    columns:
      loan_disbursement_id:
        type: UUID
        primary_key: true
        nullable: false
      disbursement_reference:
        type: VARCHAR
        nullable: false
        description: "Business key: Disbursement reference number"
      disbursed_amount:
        type: NUMERIC
        nullable: false
      target_account_number:
        type: VARCHAR
        nullable: false
        pii_classification: "PersonalData.Personal"
      disbursement_status:
        type: VARCHAR
        nullable: false
        allowed_values: ["COMPLETED", "PENDING", "FAILED"]

  financial.loan_repayment_schedule:
    description: Amortization Repayment Schedule Installments
    type: table
    columns:
      loan_repayment_schedule_id:
        type: UUID
        primary_key: true
        nullable: false
      installment_number:
        type: INTEGER
        nullable: false
      total_due:
        type: NUMERIC
        nullable: false
      installment_status:
        type: VARCHAR
        nullable: false
        allowed_values: ["PENDING", "PAID", "OVERDUE", "PARTIALLY_PAID"]

quality:
  - type: rowCountGreaterThan
    value: 1000
  - type: columnNoNulls
    column: loan_agreement_id
  - type: columnNoNulls
    column: principal_amount
